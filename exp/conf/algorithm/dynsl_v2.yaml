name: dynsl_v2
num_server_models: 1
exchange_optimizer_states: false
end_epoch_weight_integration_strategy: hierarchical
server_optim_state_handling: optim_state_resetting
layer_allocator_init_args:
  reallocation_frequency: 8.0
  max_client_layers: 1000
  gamma: 10.0
  num_concat_batches: ${server_model_servicer.num_concat_batches}
  layer_allocation_optimizer: bottleneck_descent # much better than genetic
strategy_init_args:
  end_epoch_weight_integration_strategy: ${algorithm.end_epoch_weight_integration_strategy}
  server_optim_state_handling: ${algorithm.server_optim_state_handling}
client_adapter_args:
  exchange_optimizer_states: ${algorithm.exchange_optimizer_states}
  end_epoch_weight_integration_strategy: ${algorithm.end_epoch_weight_integration_strategy}
