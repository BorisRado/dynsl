name: dynsl_simulation
num_server_models: 1
exchange_optimizer_states: false
server_optim_state_handling: reset_optim_state
layer_allocator_init_args:
  client_configuration:
    - ids: "0-17"
      evolution:
        - start: 0.0
          num_layers: 5
        - start: 0.25
          num_layers: 6
        - start: 0.5
          num_layers: 8
    - ids: "18-35"
      evolution:
        - start: 0.0
          num_layers: 5
        - start: 0.2
          num_layers: 7
    - ids: "36-40"
      evolution:
        - start: 0.0
          num_layers: 5
        - start: 0.1
          num_layers: 7
        - start: 0.7
          num_layers: 5
strategy_init_args:
  server_optim_state_handling: ${algorithm.server_optim_state_handling}
client_adapter_args:
  exchange_optimizer_states: ${algorithm.exchange_optimizer_states}
