name: dynsl_simulation
num_server_models: -1
dynamic_layers_strategy: afl
layer_allocator_init_args:
  client_configuration:
    - ids: "0-10"
      evolution:
        - start: 0.0
          num_layers: 3
        - start: 0.4
          num_layers: 11
        - start: 0.8
          num_layers: 3
    - ids: "10-25"
      evolution:
        - start: 0.0
          num_layers: 4
        - start: 0.2
          num_layers: 8
    - ids: "25-60"
      evolution:
        - start: 0.0
          num_layers: 4
        - start: 0.1
          num_layers: 8
        - start: 0.7
          num_layers: 5
strategy_init_args:
  dynamic_layers_strategy: ${algorithm.dynamic_layers_strategy}
client_adapter_args:
  dynamic_layers_strategy: ${algorithm.dynamic_layers_strategy}
