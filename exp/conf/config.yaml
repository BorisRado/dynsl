defaults:
  - model: cnn
  - data: cifar10
  - partitioning: iid
  - optimizer: sgd
  - data_manipulation: cv
  - algorithm: splitfed_v2
  - server_model_manager: multithreading
  - _self_
general:
  seed: 10
  rounds: 1
server:
  async_: true
  communication_channel: socket # options: grpc, socket
  socket_port: 9094 # port for socket communication (if enabled)
  port: 8089 # default port
client:
  server_address: 0.0.0.0:8089 # should be set at runtime
  communication_channel: ${server.communication_channel}
  socket_port: ${server.socket_port}
  init_kwargs: # kwargs that are passed to the model owner client
    cid: 0 # should be set at runtime
    min_layers: 2
    batch_size: 16
    num_epochs: 1
strategy:
  fraction_fit: 1.0
  fraction_evaluate: 0.0
  config_client_fit_fn: null
  min_fit_clients: 1
  min_evaluate_clients: 0
  min_available_clients: 1
  num_server_models: ${algorithm.num_server_models}
server_model_servicer:
  servicer_name: queue
  num_concat_batches: 1 # how many batches need to be received before sending the data to the model
  request_group_timeout: 0.8 # if by this time limit not enough data is received, the request is still given to the model
  dynamic_layers_strategy: ${oc.select:algorithm.dynamic_layers_strategy,null}
  exchange_optimizer_states: ${oc.select:algorithm.exchange_optimizer_states,false}
wandb: false
experiment_name: ... # helper to search experiments in wandb database
