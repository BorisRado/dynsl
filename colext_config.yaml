project: slwr # project name should not have spaces
job_name: "SOTA FL experiment"

code:
  # Path can be omited if colext_config.yaml is in the root folder of the project
  path: "/home/radovib/dynsl"
  python_version: "3.10"
  client:
    command: >-
      PYTHONPATH=$PYTHONPATH:. python3 exp/scripts/py/client.py
      model=vgg11
      partitioning.num_partitions=10
      algorithm=splitfed_v2

  server:
      # algorithm.layer_allocator_init_args.max_client_layers=46
      # algorithm.layer_allocator_init_args.num_client_layers=26
    command: >-
      sed -i '/FLOWER_LOGGER.addHandler(console_handler)/d' /opt/conda/lib/python3.10/site-packages/flwr/common/logger.py && PYTHONPATH=$PYTHONPATH:. python3 -u exp/scripts/py/server.py
      general.rounds=10
      algorithm=splitfed_v2
      algorithm.layer_allocator_init_args.num_client_layers=6
      strategy.min_available_clients=${COLEXT_N_CLIENTS}
      server.port=8080
      wandb=true
      model=vgg11
      partitioning.num_partitions=10
      experiment_name=colext_testing2

clients:
  - dev_type: JetsonAGXOrin
    count: 2
  - dev_type: JetsonOrinNano
    count: 4
  - dev_type: JetsonNano
    count: 3
  - dev_type: LattePandaDelta3
    count: 2
  - dev_type: JetsonXavierNX
    count: 2
  - dev_type: OrangePi5B
    count: 7
