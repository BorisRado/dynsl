syntax = "proto3";

package server_model;

// compile with the following command:
// python -m grpc_tools.protoc -I=proto/ --python_out=slbd/proto/ --pyi_out=slbd/proto/ --grpc_python_out=slbd/proto/ proto/server_model.proto
// also update `slbd.proto.server_model_pb2` in `server_model_pb2_grpc.py`

// The server model service definition.
service ServerModel {
  rpc UnaryRequest (BatchDataForward) returns (BatchDataBackward) {}

  // While documentation states that it is better to use unary RPCs, e.g.:
  // * https://stackoverflow.com/questions/56766921/multiple-unary-rpc-calls-vs-long-running-bidirectional-streaming-in-grpc
  // * https://grpc.io/docs/guides/performance/
  // according to the tests I performed the streaming version is much faster in this use case
  rpc StreamRequest (stream BatchDataForward) returns (stream BatchDataBackward) {}

}

message BatchDataForward {
  bool training = 1;  // the client specifies if requesting a forward or forward+backward
  map<string, ByteTensor> data = 2;  // dictionary with parameters to be passed to the function
  ControlCode control_code = 3;
  string cid = 4;
  float local_computation_time = 5;
}

message BatchDataBackward {
  map<string, ByteTensor> data = 1;  // dictionary with parameters to be passed to the function
  ControlCode control_code = 2;
  int32 layers_diff = 3;
  optional TensorList additional_layers_parameters = 4;
}

enum ControlCode {
  OK = 0;
  DO_CLOSE_STREAM = 1;
  STREAM_CLOSED_OK = 2;
  ERROR_PROCESSING_STREAM = 3;
  INIT_STREAM = 4;
}

message ByteTensor {
  oneof data {
    bytes single_tensor = 1;
    TensorList tensors = 2;
  }
}

message TensorList {
  repeated bytes tensors = 1;
}
