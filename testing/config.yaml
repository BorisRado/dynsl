optimizer: # configuration for the optimizer
  name: sgd
  hyperparameters:
    lr: 0.01
    momentum: 0.9
  scheduler: null # give the option to update the learning rate during training
train_config:
  loss: cross_entropy
client_config:
  batch_size: 16
global_config:
  fraction_fit: 1.0 # % of training clients - give also other options
  fraction_evaluate: 1.0 # % of evaluation clients - give also other options
  rounds: 10 # give also other options
  min_available_clients: 1  # the process will not start until this number of clients is connected
server_batch_handling_config:
  mix_batches: true
  target_client_batches: 1
